<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Café</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <img src="assets/logo.svg" alt="Logo Pixel Café" class="logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Pixel Café</h1>
      <p>Il bar dei programmatori: caffè, Wi-Fi veloce e prese di corrente a ogni tavolo.</p>
      <button id="quote-btn">Dammi un consiglio</button>
      <p id="quote" class="quote"></p>
    </section>

    <section class="info">
      <h2>Orari</h2>
      <ul>
        <li>Lunedì - Venerdì: 7:30 - 20:00</li>
        <li>Sabato: 9:00 - 18:00</li>
        <li>Domenica: chiuso (anche i server hanno bisogno di riposo)</li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 Pixel Café</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
